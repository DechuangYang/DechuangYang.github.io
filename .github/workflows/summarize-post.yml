name: Summarize Post with Gemini 4 Neon

on:
  workflow_dispatch:
    inputs:
      post_path:
        description: "文章路径或 slug（例如 content/posts/p-xxx/index.md 或 p-xxx）"
        required: true
        type: string
      overwrite:
        description: "若文章已有深度整理笔记，是否覆盖重新生成"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate summary with Gemini 4 Neon
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-4-neon
          POST_PATH: ${{ github.event.inputs.post_path }}
          OVERWRITE: ${{ github.event.inputs.overwrite }}
        run: python3 scripts/summarize_post.py

      - name: Commit summary and trigger Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain content/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/
            git commit -m "docs: auto-summarize ${{ github.event.inputs.post_path }} with gemini-4-neon"
            git push
            gh workflow run hugo.yml --ref main
          else
            echo "No changes to commit."
          fi
