{{- if and .IsPage (eq .Section "posts") .File }}
<div id="ai-summarize-bar" data-post-path="content/{{ .File.Path }}" style="display:none; margin: 14px 0 20px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--entry); align-items: center; flex-wrap: wrap; gap: 10px; font-size: 14px;">
  <button id="ai-summarize-btn" type="button" style="cursor: pointer; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--primary); color: var(--theme); font-weight: 500; font-size: 13px;">
    ✨ 用 Gemini 4 Neon 生成总结
  </button>
  <button id="ai-summarize-cfg-btn" type="button" style="cursor: pointer; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--secondary); font-size: 12px;">
    ⚙️ 设置
  </button>
  <span id="ai-summarize-status" style="color: var(--secondary); font-size: 13px;"></span>
</div>
<script>
(function () {
  var bar = document.getElementById('ai-summarize-bar');
  if (!bar) return;
  var header = document.querySelector('.post-header');
  if (header && header.parentNode) {
    header.parentNode.insertBefore(bar, header.nextSibling);
  }
  bar.style.display = 'flex';

  var KEY = 'paper_margin_actions_key';
  var REPO = 'DechuangYang/DechuangYang.github.io';
  var WF = 'summarize-post.yml';
  var btn = document.getElementById('ai-summarize-btn');
  var cfgBtn = document.getElementById('ai-summarize-cfg-btn');
  var statusEl = document.getElementById('ai-summarize-status');
  var postPath = bar.getAttribute('data-post-path');

  function readKey(ask) {
    var v = localStorage.getItem(KEY) || '';
    if (!v || ask) {
      var res = window.prompt('请输入本仓库 Actions 触发凭据（仅保存在本地浏览器）：', v);
      if (res === null) return null;
      v = res.trim();
      if (v) localStorage.setItem(KEY, v);
      else localStorage.removeItem(KEY);
    }
    return v;
  }

  cfgBtn.addEventListener('click', function () {
    var k = readKey(true);
    if (k) statusEl.textContent = '已保存本地设置。';
    else if (k === '') statusEl.textContent = '已清除本地设置。';
  });

  btn.addEventListener('click', async function () {
    var k = readKey(false);
    if (!k) return;

    var hasSummary = Array.from(document.querySelectorAll('.post-content h1')).some(function (h) {
      return (h.textContent || '').indexOf('深度整理笔记') !== -1;
    });
    var overwrite = false;
    if (hasSummary) {
      if (!window.confirm('这篇文章已有「深度整理笔记」，是否覆盖重新生成？')) return;
      overwrite = true;
    }

    btn.disabled = true;
    statusEl.textContent = '正在触发 Gemini 4 Neon 生成总结...';

    try {
      var resp = await fetch(
        'https://api.github.com/repos/' + REPO + '/actions/workflows/' + WF + '/dispatches',
        {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': 'Bearer ' + k,
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            ref: 'main',
            inputs: { post_path: postPath, overwrite: overwrite ? 'true' : 'false' }
          })
        }
      );

      if (resp.status === 204) {
        statusEl.innerHTML =
          '✅ 已触发生成，约 1～2 分钟后刷新页面查看（<a href="https://github.com/' +
          REPO + '/actions/workflows/' + WF +
          '" target="_blank" rel="noopener" style="text-decoration:underline;">查看进度</a>）。';
      } else if (resp.status === 401 || resp.status === 403) {
        statusEl.textContent = '❌ 权限不足或凭据无效（HTTP ' + resp.status + '），请点「⚙️ 设置」更新。';
      } else {
        var txt = await resp.text();
        statusEl.textContent = '❌ 触发失败（HTTP ' + resp.status + '）：' + txt.slice(0, 120);
      }
    } catch (e) {
      statusEl.textContent = '❌ 请求失败：' + (e && e.message ? e.message : e);
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
{{- end }}
