{{- define "main" }}
<div class="pm-write">
  <div class="pm-topbar">
    <div>
      <h1>写文章</h1>
      <p>支持 Markdown 实时分栏预览、粘贴或拖拽截图、自动保存本机草稿，并一键发布到本站。</p>
    </div>
  </div>

  <div class="pm-grid">
    <aside class="pm-sidebar">
      <div class="pm-sidehead">
        <div class="pm-sidehead-title">
          <h2>本机草稿</h2>
          <span id="pm-draft-count" class="pm-badge">0</span>
        </div>
        <button type="button" id="pm-new-post" class="pm-btn pm-btn-primary pm-btn-sm" disabled>+ 新文章</button>
      </div>
      <ul id="pm-draft-list" class="pm-draft-list"></ul>
      <div class="pm-draft-tools">
        <button type="button" id="pm-export-drafts" class="pm-btn pm-btn-sm pm-btn-full" disabled>导出草稿备份</button>
        <label class="pm-import-label">导入草稿备份 <input type="file" id="pm-import-drafts" accept=".json,application/json" disabled></label>
      </div>
    </aside>

    <form id="pm-form" class="pm-form">
      <fieldset disabled>
        <div class="pm-card">
          <div class="pm-meta">
            <div class="pm-fields">
              <label class="pm-field">
                <span class="pm-sr">标题</span>
                <input name="title" maxlength="100" placeholder="输入文章标题…">
              </label>
              <label class="pm-field">
                <span class="pm-sr">分类</span>
                <select name="category" aria-label="文章分类">
                  <option value="技术笔记">技术笔记</option>
                  <option value="随笔">随笔</option>
                </select>
              </label>
            </div>
            <div class="pm-fields pm-fields-sub">
              <label class="pm-field">
                <span class="pm-sr">摘要</span>
                <input name="summary" maxlength="240" placeholder="一句话摘要（可选，显示在首页列表）">
              </label>
              <label class="pm-field">
                <span class="pm-sr">标签</span>
                <input name="tags" maxlength="120" placeholder="标签（逗号分隔，如 AI, 架构）">
              </label>
            </div>
          </div>

          <div class="pm-toolbar" role="toolbar" aria-label="Markdown 格式与视图切换">
            <div class="pm-format-group">
              <button type="button" class="pm-tool" data-md="h2" title="二级标题">H2</button>
              <button type="button" class="pm-tool" data-md="h3" title="三级标题">H3</button>
              <span class="pm-sep" aria-hidden="true"></span>
              <button type="button" class="pm-tool" data-md="bold" title="加粗">B</button>
              <button type="button" class="pm-tool" data-md="italic" title="斜体">I</button>
              <button type="button" class="pm-tool" data-md="code" title="行内代码">`</button>
              <button type="button" class="pm-tool" data-md="codeblock" title="代码块">{ }</button>
              <span class="pm-sep" aria-hidden="true"></span>
              <button type="button" class="pm-tool" data-md="quote" title="引用">引用</button>
              <button type="button" class="pm-tool" data-md="list" title="列表">列表</button>
              <button type="button" class="pm-tool" data-md="link" title="链接">链接</button>
              <button type="button" class="pm-tool" data-md="table" title="表格">表格</button>
            </div>
            <div class="pm-view-tabs" role="group" aria-label="视图模式">
              <button type="button" class="pm-view-tab" data-mode="edit" aria-pressed="false">编辑</button>
              <button type="button" class="pm-view-tab" data-mode="split" aria-pressed="true">分栏</button>
              <button type="button" class="pm-view-tab" data-mode="preview" aria-pressed="false">预览</button>
            </div>
          </div>

          <div id="pm-panes" class="pm-panes mode-split">
            <div class="pm-write-pane">
              <label class="pm-sr" for="pm-body">正文 Markdown</label>
              <textarea id="pm-body" name="body" rows="16" maxlength="60000" aria-describedby="pm-paste-hint" placeholder="使用 Markdown 开始写作… 可直接粘贴或拖拽截图。"></textarea>
            </div>
            <section id="pm-preview" class="pm-preview-pane" aria-label="实时预览">
              <div class="post-content pm-prose"></div>
            </section>
          </div>

          <div class="pm-footer">
            <div class="pm-footer-info">
              <p id="pm-word-count" class="pm-word-count" aria-live="polite">0 字</p>
              <p id="pm-paste-hint" class="pm-hint">支持粘贴/拖拽 PNG、JPEG、GIF、WebP（≤ 8 MB） · Ctrl+S 保存</p>
            </div>
            <div class="pm-actions">
              <p id="pm-status" class="pm-status" role="status"></p>
              <button type="button" id="pm-save" class="pm-btn pm-btn-primary pm-btn-sm">保存草稿</button>
            </div>
          </div>
        </div>

        <details class="pm-publish-panel">
          <summary>发布到 GitHub（在线上线）与文章管理</summary>
          <div class="pm-publish-body">
            <label class="pm-field">
              <span class="pm-field-label">GitHub 细粒度访问令牌（仅需授权 <code>DechuangYang.github.io</code> 的 Contents 读写权限 · <a class="pm-link" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">去生成 ↗</a>）</span>
              <input id="pm-token" type="password" autocomplete="off" placeholder="github_pat_...（填一次后本机自动记住）">
            </label>
            <div class="pm-publish-actions">
              <label class="pm-checkbox">
                <input id="pm-remember-token" type="checkbox" checked>
                在本机浏览器长期记住令牌（下次打开自动填入）
              </label>
              <button type="button" id="pm-clear-token" class="pm-btn pm-btn-sm">清除已保存令牌</button>
            </div>
            <label class="pm-checkbox">
              <input id="pm-publish-confirm" type="checkbox">
              我确认将这篇文章和正文图片公开发布到 https://dechuangyang.github.io/
            </label>
            <div class="pm-publish-actions">
              <button type="submit" id="pm-publish" class="pm-btn pm-btn-primary">发布文章</button>
        <button type="button" id="pm-summarize" class="pm-btn">✨ 用 Gemini 4 Neon 生成总结</button>
        <span id="pm-summarize-status" class="pm-status" role="status" aria-live="polite"></span>
              <p id="pm-publish-status" class="pm-status" role="status"></p>
              <a id="pm-commit-link" class="pm-link" target="_blank" rel="noopener" hidden>查看 GitHub 提交 ↗</a>
              <a id="pm-actions-link" class="pm-link" href="https://github.com/DechuangYang/DechuangYang.github.io/actions" target="_blank" rel="noopener" hidden>查看部署进度 ↗</a>
            </div>

            <details class="pm-delete-panel">
              <summary>删除已发布文章</summary>
              <div class="pm-publish-body">
                <div class="pm-delete-row">
                  <select id="pm-delete-target" aria-label="选择已发布文章">
                    <option value="">点击「加载文章列表」获取已发布文章</option>
                  </select>
                  <button type="button" id="pm-load-posts" class="pm-btn pm-btn-sm">加载文章列表</button>
                </div>
                <label class="pm-checkbox">
                  <input id="pm-delete-confirm" type="checkbox">
                  我确认删除选中的已发布文章（提交后约 30 秒自动下线）
                </label>
                <div class="pm-publish-actions">
                  <button type="button" id="pm-delete" class="pm-btn pm-btn-danger">删除文章</button>
                  <p id="pm-delete-status" class="pm-status" role="status"></p>
                </div>
              </div>
            </details>
          </div>
        </details>
      </fieldset>
    </form>
  </div>
</div>
<script src="{{ "js/write.js" | relURL }}" defer></script>
<script>
(function () {
  var btn = document.getElementById('pm-summarize');
  var statusEl = document.getElementById('pm-summarize-status');
  if (!btn || !statusEl) return;

  var REPO = 'DechuangYang/DechuangYang.github.io';
  var WF = 'summarize-post.yml';

  function resolveTargetPath() {
    var activeId = '';
    try { activeId = (localStorage.getItem('pm-hugo:active-draft') || '').trim(); } catch (e) {}
    if (activeId) {
      return 'content/posts/p-' + activeId + '/index.md';
    }
    var sel = document.getElementById('pm-post-select');
    if (sel && sel.value) {
      var val = sel.value;
      var idx = val.indexOf(':');
      var type = idx > 0 ? val.slice(0, idx) : '';
      var path = idx > 0 ? val.slice(idx + 1) : val;
      if (type === 'dir') return path.replace(/\/+$/, '') + '/index.md';
      if (path) return path;
    }
    return '';
  }

  btn.addEventListener('click', async function () {
    var tokenInput = document.getElementById('pm-token');
    var k = (tokenInput && tokenInput.value ? tokenInput.value.trim() : '');
    if (!k) {
      try { k = (localStorage.getItem('pm-hugo:saved-token') || '').trim(); } catch (e) {}
    }
    if (!k) {
      statusEl.textContent = '请先在上方填写 GitHub 凭据（需包含本仓库 Actions 读写权限）。';
      return;
    }

    var postPath = resolveTargetPath();
    if (!postPath) {
      statusEl.textContent = '未检测到当前文章路径，请先保存并发布文章到 GitHub。';
      return;
    }

    var bodyEl = document.getElementById('pm-body');
    var hasSummary = bodyEl && (bodyEl.value || '').indexOf('# 深度整理笔记') !== -1;
    var overwrite = false;
    if (hasSummary) {
      if (!window.confirm('当前文章已包含「深度整理笔记」，是否让 Gemini 4 Neon 覆盖重新生成？')) {
        return;
      }
      overwrite = true;
    }

    btn.disabled = true;
    statusEl.textContent = '正在触发 Gemini 4 Neon 总结（' + postPath + '）...';

    try {
      var resp = await fetch(
        'https://api.github.com/repos/' + REPO + '/actions/workflows/' + WF + '/dispatches',
        {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': 'Bearer ' + k,
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            ref: 'main',
            inputs: { post_path: postPath, overwrite: overwrite ? 'true' : 'false' }
          })
        }
      );

      if (resp.status === 204) {
        statusEl.innerHTML =
          '✅ 已触发生成，约 1～2 分钟后自动提交并部署（<a href="https://github.com/' +
          REPO + '/actions/workflows/' + WF +
          '" target="_blank" rel="noopener" style="text-decoration:underline;">查看进度</a>）。';
      } else if (resp.status === 401 || resp.status === 403) {
        statusEl.textContent = '❌ 权限不足（HTTP ' + resp.status + '），请确认上方凭据已勾选本仓库 Actions: Read and write 权限。';
      } else {
        var txt = await resp.text();
        statusEl.textContent = '❌ 触发失败（HTTP ' + resp.status + '）：' + txt.slice(0, 120);
      }
    } catch (e) {
      statusEl.textContent = '❌ 请求失败：' + (e && e.message ? e.message : e);
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
{{- end }}
